<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF1E2">
<title>동물 그림자 놀이</title>
<style>
/* Layout: 한 화면 고정 무대 — 위 별 진행표, 가운데 스포트라이트 무대, 아래 큰 터치 버튼 */
:root {
  --sky: #FFF1E2;      /* 배경 위 (살구빛) */
  --blush: #FFE2EC;    /* 배경 아래 (분홍빛) */
  --ink: #4A3657;      /* 글자 */
  --paper: #FFFFFF;
  --sun: #FFC845;
  --peach: #FF9E7A;
  --berry: #FF6F9C;
  --mint: #5CCBAE;
  --sea: #69B8FF;
  --lilac: #A58BFF;
  --star-off: #EADCF0;
  --font-display: "Jua", "BM JUA_OTF", "Cafe24 Ssurround", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: linear-gradient(180deg, var(--sky) 0%, var(--blush) 100%);
  color: var(--ink);
  font-family: var(--font-display);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overscroll-behavior: none;
}

/* ---------- 떠다니는 배경 방울 ---------- */
.bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.bg span { position: absolute; border-radius: 50%; opacity: .55; animation: float 9s ease-in-out infinite; }
.bg .b1 { width: 34vmin; height: 34vmin; left: -8vmin; top: 8%;  background: #FFE7A3; }
.bg .b2 { width: 26vmin; height: 26vmin; right: -6vmin; top: 30%; background: #CDEFE4; animation-delay: -3s; }
.bg .b3 { width: 40vmin; height: 40vmin; left: 18%; bottom: -16vmin; background: #E4DAFF; animation-delay: -6s; }
.bg .b4 { width: 14vmin; height: 14vmin; right: 18%; top: 6%; background: #FFD0DE; animation-delay: -2s; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4vmin); } }

/* ---------- 화면 공통 ---------- */
#app { position: relative; height: 100%; }
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
  gap: 12px;
  padding-inline: 16px;
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  animation: screenIn .45s ease-out both;
}
@keyframes screenIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

/* 사탕처럼 볼록한 버튼 */
.btn {
  font-family: inherit; font-weight: 900; color: var(--paper);
  border: 0; cursor: pointer;
  text-shadow: 0 3px 0 rgba(74, 54, 87, .25);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(6px); }
.btn:focus-visible { outline: 6px solid var(--sea); outline-offset: 6px; }

/* ---------- 시작 화면 ---------- */
.start-art { display: flex; align-items: center; gap: 4vmin; }
.start-art svg { width: min(30vmin, 180px); height: auto; }
.start-art .shadow-ico { filter: brightness(0); animation: sway 2.4s ease-in-out infinite; }
.start-art .color-ico  { animation: hop .6s ease-in-out infinite alternate; }
.start-art .arrow { font-size: min(10vmin, 56px); color: var(--berry); font-weight: 900; }
.logo {
  margin: 0; font-size: clamp(40px, 11vmin, 88px); line-height: 1.1; letter-spacing: .02em;
  text-wrap: balance; text-align: center;
  color: var(--ink);
  text-shadow: 0 5px 0 var(--paper);
}
/* 종류 고르기 카드 (그림 + 이름) */
/* 카드 6장: 세로 화면 3+3, 가로로 낮은 화면은 한 줄 */
.cats { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 12px; max-width: min(100%, 504px); }
.cat {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  width: clamp(100px, 28.5vw, 160px);
  padding: 8px 8px 12px; border-radius: 28px;
  background: var(--card); color: var(--ink);
  font-size: clamp(26px, 6.5vmin, 42px); text-shadow: 0 3px 0 var(--paper);
  box-shadow: 0 9px 0 var(--edge), 0 16px 26px rgba(74, 54, 87, .15);
  animation: bob 1.4s ease-in-out infinite;
}
.cat:nth-child(2) { animation-delay: .2s; }
.cat:nth-child(3) { animation-delay: .4s; }
.cat:nth-child(4) { animation-delay: .6s; }
.cat:nth-child(5) { animation-delay: .8s; }
.cat:nth-child(6) { animation-delay: 1s; }
.cat:active { box-shadow: 0 3px 0 var(--edge); animation: none; }
.cat svg { width: 82%; height: auto; }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.04); } }

/* ---------- 문제 화면 ---------- */
/* 우측 상단: 첫 화면(종류 고르기)으로 */
.btn-back {
  position: absolute; z-index: 2;
  top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
  width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--paper); color: var(--ink);
  box-shadow: 0 5px 0 var(--star-off), 0 8px 16px rgba(74, 54, 87, .12);
}
.btn-back:active { box-shadow: 0 1px 0 var(--star-off); }
.btn-music {
  position: fixed; z-index: 3;
  top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px));
  width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--paper); color: var(--berry);
  box-shadow: 0 5px 0 var(--star-off), 0 8px 16px rgba(74, 54, 87, .12);
}
.btn-music:active { box-shadow: 0 1px 0 var(--star-off); }
.btn-music svg { width: 28px; height: 28px; }
.btn-music .slash { display: none; }
.btn-music.off { color: var(--ink); opacity: .55; }
.btn-music.off .slash { display: inline; }
.voice-note {
  position: fixed; z-index: 3; left: 16px; right: 16px;
  bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  margin: 0 auto; max-width: 32em; padding: 6px 12px; border-radius: 14px;
  background: rgba(255, 255, 255, .85); color: var(--ink);
  text-align: center; font-size: 14px; line-height: 1.45; text-wrap: balance;
  pointer-events: none;
}
/* 손가락이 조금 움직여도 '떼는 순간(pointerup)'이 꼭 오도록 */
#screen-quiz { touch-action: none; }
.btn-back svg { width: 28px; height: 28px; }
.progress { display: flex; gap: 10px; font-size: clamp(28px, 7vmin, 44px); line-height: 1; }
.progress span { color: var(--star-off); text-shadow: 0 3px 0 var(--paper); transition: color .3s; }
.progress span.on { color: var(--sun); animation: starPop .6s cubic-bezier(.3, 1.8, .5, 1); }
.progress.many { gap: 4px; font-size: clamp(20px, 5vmin, 32px); }
@keyframes starPop { 0% { transform: scale(.4) rotate(-60deg); } 100% { transform: scale(1) rotate(0); } }

.prompt {
  margin: 0; min-height: 1.3em;
  font-size: clamp(32px, 8.5vmin, 64px); line-height: 1.2; text-align: center; text-wrap: balance;
  color: var(--ink);
  text-shadow: 0 4px 0 var(--paper);
}
.prompt.name {
  padding: .05em .7em; border-radius: 999px;
  background: var(--paper); color: var(--accent, var(--berry));
  font-size: clamp(44px, 12vmin, 92px);
  text-shadow: none;
  box-shadow: 0 8px 0 rgba(74, 54, 87, .12);
  animation: namePop .7s cubic-bezier(.3, 1.8, .5, 1) both;
}
.prompt small { font-size: .45em; margin-left: .3em; color: var(--ink); opacity: .7; }
/* 이름이 긴 공룡: 글자를 줄이고 울음소리는 아랫줄로 */
.prompt.name.long { font-size: clamp(30px, 8vmin, 64px); border-radius: 32px; max-width: 100%; }
.prompt.name.long small { display: block; margin: 0; font-size: .6em; }
@keyframes namePop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.stage {
  position: relative;
  width: min(72vw, 44vh, 430px); max-width: 100%;
  aspect-ratio: 1;
  flex: 0 0 auto;
}
.disc, .tint, .rays { position: absolute; border-radius: 50%; }
.disc { inset: 2%; background: radial-gradient(circle at 50% 45%, var(--paper) 0 52%, rgba(255, 255, 255, 0) 71%); }
.tint { inset: 2%; background: radial-gradient(circle at 50% 45%, var(--tint, #FFF) 0 50%, rgba(255, 255, 255, 0) 71%); opacity: 0; transition: opacity .5s; }
.rays {
  inset: -22%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .7) 0 9deg, rgba(255, 255, 255, 0) 9deg 20deg);
  -webkit-mask: radial-gradient(circle, #000 28%, transparent 68%);
          mask: radial-gradient(circle, #000 28%, transparent 68%);
  opacity: 0; transition: opacity .4s;
}
.stage.revealed .tint { opacity: 1; }
.stage.revealed .rays { opacity: 1; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.floor {
  position: absolute; left: 22%; right: 22%; bottom: 3%; height: 7%;
  border-radius: 50%; background: rgba(74, 54, 87, .14);
}
.animal-wrap { position: absolute; inset: 6%; }
.animal-wrap svg {
  display: block; width: 100%; height: 100%; overflow: visible;
  filter: brightness(0);
  transform-origin: 50% 88%;
  transition: filter .55s ease .1s;
}
.animal-wrap.question svg { animation: enter .6s cubic-bezier(.34, 1.56, .64, 1) both, sway 2.4s ease-in-out .6s infinite; }
.animal-wrap.revealed svg { filter: brightness(1); animation: pop 1s cubic-bezier(.3, 1.4, .5, 1) both, hopBig .55s ease-in-out 1s infinite alternate; }
.animal-wrap.leaving svg  { filter: brightness(1); animation: leave .45s ease-in both; }
@keyframes enter { from { transform: scale(.2) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sway { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes pop {
  0% { transform: scale(1); } 25% { transform: scale(1.3); } 45% { transform: scale(.9); }
  65% { transform: scale(1.16); } 82% { transform: scale(1.05); } 100% { transform: scale(1.1); }
}
@keyframes hopBig { from { transform: scale(1.1) translateY(0); } to { transform: scale(1.13, 1.07) translateY(-5%); } }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-8%); } }
@keyframes leave { to { transform: scale(.3) translateY(30%); opacity: 0; } }

.burst { position: absolute; inset: 0; pointer-events: none; }
.burst span {
  position: absolute; left: 50%; top: 50%;
  line-height: 1; font-weight: 900;
  animation: fly 1.1s cubic-bezier(.15, .8, .3, 1) both;
}
@keyframes fly {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(.3) rotate(0); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--rot)); }
}

.tap-zone { position: relative; display: grid; place-items: center; }
.btn-reveal {
  width: clamp(96px, 22vmin, 140px); aspect-ratio: 1; border-radius: 50%;
  font-size: clamp(60px, 14vmin, 92px); line-height: 1;
  background: radial-gradient(circle at 35% 30%, #FFB3C9, var(--berry) 60%);
  box-shadow: 0 9px 0 #D94B7C, 0 16px 26px rgba(255, 111, 156, .35);
  animation: pulse 1.2s ease-in-out infinite;
  transition: opacity .25s, transform .25s;
}
.btn-reveal:active { box-shadow: 0 3px 0 #D94B7C; animation: none; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.hand {
  position: absolute; right: -30%; bottom: -18%;
  font-size: clamp(44px, 10vmin, 64px); pointer-events: none;
  animation: tap 1.2s ease-in-out infinite;
}
@keyframes tap { 0%, 100% { transform: translate(0, 0) rotate(-20deg); } 50% { transform: translate(-18%, -22%) rotate(-20deg) scale(.92); } }
.tap-zone.away .btn-reveal, .tap-zone.away .hand { opacity: 0; transform: scale(.4); animation: none; pointer-events: none; }

/* ---------- 완료 화면 ---------- */
#fireworks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cheer {
  position: relative; margin: 0;
  font-size: clamp(48px, 13vmin, 110px); line-height: 1.15; text-align: center;
  display: flex; flex-wrap: wrap; justify-content: center;
}
.cheer span { display: inline-block; text-shadow: 0 6px 0 var(--paper); animation: letter 1s ease-in-out infinite; }
.cheer span.gap { width: .35em; }
@keyframes letter { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14%) rotate(4deg); } }
.trophy { position: relative; font-size: clamp(56px, 16vmin, 120px); line-height: 1; color: var(--sun); text-shadow: 0 6px 0 #F2A41F; animation: spinStar 2.4s ease-in-out infinite; }
@keyframes spinStar { 0%, 100% { transform: rotate(-12deg) scale(1); } 50% { transform: rotate(12deg) scale(1.12); } }
.parade { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 2vmin; max-width: 100%; }
.parade svg { width: min(16vmin, 96px); height: auto; animation: hop .5s ease-in-out infinite alternate; }
.parade.many { max-width: min(100%, 560px); }
.parade.many svg { width: min(14vmin, 80px); }
.btn-again {
  position: relative;
  font-size: clamp(32px, 7.5vmin, 56px);
  padding: .4em 1.2em; border-radius: 999px;
  background: linear-gradient(135deg, #8BE3C9, var(--mint) 50%, var(--sea));
  box-shadow: 0 10px 0 #3FA88D, 0 18px 30px rgba(92, 203, 174, .35);
  animation: bob 1.4s ease-in-out infinite;
}
.btn-again:active { box-shadow: 0 4px 0 #3FA88D; animation: none; }
.done-btns { position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.btn-home {
  font-size: clamp(20px, 4.5vmin, 30px);
  padding: .35em 1.1em; border-radius: 999px;
  background: var(--paper); color: var(--ink); text-shadow: none;
  box-shadow: 0 6px 0 var(--star-off);
}
.btn-home:active { box-shadow: 0 2px 0 var(--star-off); }
.stage.sea .floor { opacity: 0; }

/* 가로로 낮은 화면(휴대폰 가로) */
@media (max-height: 520px) {
  .screen { justify-content: center; gap: 6px; }
  .stage { width: min(60vw, 52vh, 430px); }
  .progress { font-size: 24px; }
  .btn-reveal { width: 84px; font-size: 54px; }
  .hand { font-size: 40px; }
  .start-art { display: none; }
  #screen-start { gap: 20px; }
  .cats { flex-wrap: nowrap; max-width: 100%; }
  .cat { width: clamp(80px, 14vw, 120px); }
  .done-btns { flex-direction: row; }
}

@media (prefers-reduced-motion: reduce) {
  .bg span, .stage.revealed .rays, .cat, .btn-again, .btn-reveal, .hand { animation: none; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span></div>

<button id="btn-music" class="btn btn-music" type="button" aria-label="배경음악 켜기/끄기" aria-pressed="true">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.8" fill="currentColor"/><circle cx="16.5" cy="16" r="2.8" fill="currentColor"/><path class="slash" d="M4 3l17 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
</button>

<p class="voice-note" id="voice-note" role="status" hidden></p>

<main id="app">
  <!-- 1. 시작 화면 -->
  <section id="screen-start" class="screen">
    <div class="start-art" id="start-art" aria-hidden="true"></div>
    <h1 class="logo">그림자 놀이</h1>
    <div class="cats" id="cats"></div>
  </section>

  <!-- 2. 문제 화면 -->
  <section id="screen-quiz" class="screen" hidden>
    <button id="btn-back" class="btn btn-back" type="button" aria-label="처음으로">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h4.5v-5.5h4v5.5h4.5V10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/></svg>
    </button>
    <div class="progress" id="progress" aria-label="진행"></div>
    <h2 class="prompt" id="prompt" aria-live="polite">어떤 동물일까요?</h2>
    <div class="stage" id="stage">
      <div class="rays"></div>
      <div class="disc"></div>
      <div class="tint"></div>
      <div class="floor"></div>
      <div class="animal-wrap" id="animal"></div>
      <div class="burst" id="burst"></div>
    </div>
    <div class="tap-zone" id="tap-zone">
      <button id="btn-reveal" class="btn btn-reveal" type="button" aria-label="정답 보기">?</button>
      <span class="hand" aria-hidden="true">👆</span>
    </div>
  </section>

  <!-- 3. 완료 화면 -->
  <section id="screen-done" class="screen" hidden>
    <canvas id="fireworks" aria-hidden="true"></canvas>
    <div class="trophy" aria-hidden="true">★</div>
    <h2 class="cheer" id="cheer" aria-label="참 잘했어요!"></h2>
    <div class="parade" id="parade" aria-hidden="true"></div>
    <div class="done-btns">
      <button id="btn-again" class="btn btn-again" type="button">↻ 다시 하기</button>
      <button id="btn-home" class="btn btn-home" type="button">처음으로</button>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';

  /* =========================================================
   * 1. 동물 그림 (SVG, viewBox 0 0 200 200)
   *    같은 그림에 CSS filter: brightness(0) 을 주면 그림자가 된다.
   * ========================================================= */
  const eye = (x, y, r = 5.5) =>
    `<circle cx="${x}" cy="${y}" r="${r}" fill="#33231A"/><circle cx="${x + r * .35}" cy="${y - r * .4}" r="${r * .38}" fill="#fff"/>`;

  const lionMane = Array.from({ length: 14 }, (_, i) => {
    const a = (i / 14) * Math.PI * 2;
    return `<circle cx="${(100 + Math.cos(a) * 50).toFixed(1)}" cy="${(80 + Math.sin(a) * 50).toFixed(1)}" r="21"/>`;
  }).join('');

  const ANIMALS = [
    {
      name: '사자', sound: '어흥!', accent: '#E07A1F', tint: '#FFE3B8',
      svg: `
        <path d="M136 172 C 170 176, 184 150, 172 128" fill="none" stroke="#F0A040" stroke-width="7" stroke-linecap="round"/>
        <circle cx="171" cy="121" r="11" fill="#C9661C"/>
        <ellipse cx="100" cy="158" rx="44" ry="34" fill="#FFD36E"/>
        <ellipse cx="100" cy="166" rx="24" ry="20" fill="#FFE9B0"/>
        <ellipse cx="80" cy="188" rx="15" ry="9" fill="#FFC94D"/>
        <ellipse cx="120" cy="188" rx="15" ry="9" fill="#FFC94D"/>
        <g fill="#F08C2E"><circle cx="100" cy="80" r="54"/>${lionMane}</g>
        <circle cx="72" cy="50" r="12" fill="#FFD36E"/><circle cx="72" cy="50" r="6" fill="#F7A85C"/>
        <circle cx="128" cy="50" r="12" fill="#FFD36E"/><circle cx="128" cy="50" r="6" fill="#F7A85C"/>
        <circle cx="100" cy="82" r="38" fill="#FFD36E"/>
        ${eye(86, 76)}${eye(114, 76)}
        <ellipse cx="78" cy="92" rx="7" ry="4.5" fill="#FF9EAA" opacity=".75"/>
        <ellipse cx="122" cy="92" rx="7" ry="4.5" fill="#FF9EAA" opacity=".75"/>
        <ellipse cx="92" cy="98" rx="10" ry="8" fill="#FFF3D6"/>
        <ellipse cx="108" cy="98" rx="10" ry="8" fill="#FFF3D6"/>
        <path d="M93 87 Q100 83 107 87 Q104 94 100 95 Q96 94 93 87Z" fill="#7A3E1D"/>
        <path d="M93 104 Q100 111 107 104" fill="none" stroke="#7A3E1D" stroke-width="3" stroke-linecap="round"/>`
    },
    {
      name: '코끼리', sound: '뿌우!', accent: '#4C7CC4', tint: '#DCEBFF',
      svg: `
        <path d="M172 112 Q186 124 184 142" fill="none" stroke="#7E9CC6" stroke-width="5" stroke-linecap="round"/>
        <circle cx="184" cy="146" r="5" fill="#6B88B3"/>
        <rect x="70" y="136" width="22" height="50" rx="10" fill="#8FAEDA"/>
        <rect x="136" y="136" width="22" height="50" rx="10" fill="#8FAEDA"/>
        <ellipse cx="120" cy="118" rx="58" ry="44" fill="#A9C6EE"/>
        <rect x="88" y="138" width="22" height="50" rx="10" fill="#A9C6EE"/>
        <rect x="150" y="138" width="22" height="50" rx="10" fill="#A9C6EE"/>

   *  3) 고른 한국어 음성이 기기에서 실제로는 안 나올 수 있다 → 2초 안에 시작 안 하면 기본 음성으로 다시 */
  let curUtter = null;
  let useChosenVoice = true;   // 고른 음성이 실패하면 false (기기 기본 한국어 음성 사용)
  let speechWorked = false;    // 한 번이라도 실제로 소리가 시작됐는지

  let failStreak = 0;          // 연속으로 소리가 시작되지 않은 횟수
  const START_TIMEOUT = 2000;

  function speakNow(text, rate, pitch, withVoice, id, onFail) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    if (withVoice && koVoice) u.voice = koVoice;
    u.rate = rate; u.pitch = pitch; u.volume = 1;
    let started = false, failed = false;
    const fail = () => {
      if (failed || started) return;
      failed = true;
      failStreak++;
      if (!speechWorked && failStreak >= 2) showVoiceNote('blocked');
      if (id === sayId && onFail) onFail();
    };
    u.onstart = () => {
      started = true; speechWorked = true; failStreak = 0;
      if (!withVoice) useChosenVoice = false;
      if (noteKind === 'blocked') document.getElementById('voice-note').hidden = true;
      bgmDuck(true);
    };
    u.onend = () => bgmDuck(false);
    u.onerror = e => { bgmDuck(false); if (e.error !== 'interrupted' && e.error !== 'canceled') fail(); };
    curUtter = u;
    synth.resume(); // 크롬이 '일시정지'에 걸려 있는 경우 풀어 준다
    synth.speak(u);
    setTimeout(fail, START_TIMEOUT);
  }

  function say(text, { rate, pitch } = VOICE_ASK) {
    if (!synth || !text) return;
    const id = ++sayId;
    const retry = () => {
      synth.cancel();
      setTimeout(() => { if (id === sayId) speakNow(text, rate, Math.min(pitch, 1.6), false, id, null); }, 150);
    };
    const go = () => {
      if (id !== sayId) return;
      speakNow(text, rate, pitch, useChosenVoice, id, useChosenVoice && koVoice ? retry : null);
    };
    if (synth.speaking || synth.pending) { synth.cancel(); setTimeout(go, 150); }
    else go();
  }

  // 보호자용 안내 (화면 맨 아래)
  const VOICE_NOTES = {
    none: '이 기기에서 한국어 음성을 찾지 못해 정답을 소리로 읽어 주지 못해요.',
    blocked: '이 화면에서는 음성 읽기가 나오지 않아요. 휴대폰의 크롬이나 사파리 브라우저에서 열어 보세요.'
  };
  let noteKind = '';
  function showVoiceNote(kind) {
    noteKind = kind;
    const el = document.getElementById('voice-note');
    el.textContent = VOICE_NOTES[kind];
    el.hidden = false;
  }
  // 말이 끝날 때까지(최대 maxMs) 기다린 뒤 cb
  function afterSpeech(cb, maxMs = 2500) {
    const t0 = performance.now();
    (function check() {
      if (!synth || !synth.speaking || performance.now() - t0 > maxMs) cb();
      else later(check, 150);
    })();
  }

  let ac = null, master = null;
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.9;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  // t: 절대 시각(ac.currentTime 기준)
  function note(freq, t, dur, type, vol, dest) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function tone(freq, at, dur, type = 'triangle', vol = 0.16) {
    const c = audio(); if (!c) return;
    note(freq, c.currentTime + at, dur, type, vol, master);
  }
  function sfxPop() {
    const c = audio(); if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(980, t + 0.13);
    g.gain.setValueAtTime(0.25, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.2);
  }
  function sparkle(from, count) {
    const hi = [1568, 1760, 2093, 2349, 2637];
    for (let i = 0; i < count; i++) tone(hi[Math.floor(Math.random() * hi.length)], from + i * 0.07, 0.18, 'sine', 0.06);
  }
  // 완료 축하 멜로디
  function sfxFinale() {
    [[392, 0], [523, .15], [659, .3], [784, .45], [659, .65], [784, .8]].forEach(([f, t]) => tone(f, t, 0.2));
    [523, 659, 784, 1047].forEach(f => tone(f, 1.0, 1.1, 'triangle', 0.1));
    sparkle(1.05, 10);
  }

  /* ---------- 배경음악: 오르골 느낌의 8마디 반복 (120bpm, 8분음표 64칸 = 16초) ---------- */
  const _ = null;
  const BGM_MELODY = [
    72, _, 76, _, 79, _, 76, _,   77, _, 81, _, 79, _, _, _,
    76, _, 79, _, 84, _, 79, _,   77, 76, 74, _, 72, _, _, _,
    74, _, 77, _, 81, _, 77, _,   79, _, 76, _, 72, _, 76, _,
    77, 79, 81, 79, 77, 76, 74, 76, 72, _, 79, _, 72, _, _, _
  ];
  const BGM_BASS = [48, 53, 48, 55, 50, 48, 53, 48]; // 마디별 근음 (C F C G Dm C F C)
  const EIGHTH = 0.25, BGM_VOL = 0.5, BGM_DUCK = 0.15;
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  const bgm = { on: true, playing: false, gain: null, step: 0, nextT: 0, timer: 0 };
  try { bgm.on = localStorage.getItem('shadow-bgm') !== 'off'; } catch (e) { /* 저장소를 못 쓰면 켜진 채로 */ }

  function bgmStep(i, t) {
    const m = BGM_MELODY[i];
    if (m) {
      note(midi(m), t, 0.45, 'sine', 0.12, bgm.gain);           // 오르골 본음
      note(midi(m + 12), t, 0.18, 'triangle', 0.03, bgm.gain);  // 반짝이는 배음
    }
    const bar = Math.floor(i / 8), beat = i % 8;
    let root = BGM_BASS[bar];
    if (bar === 6 && beat >= 4) root = 55;                       // 7마디 뒤 절반은 G
    if (beat === 0) note(midi(root), t, 0.5, 'triangle', 0.09, bgm.gain);
    if (beat === 4) note(midi(root + 7), t, 0.4, 'triangle', 0.07, bgm.gain);
  }
  function bgmTick() {
    if (!ac) return;
    while (bgm.nextT < ac.currentTime + 0.2) {
      bgmStep(bgm.step, bgm.nextT);
      bgm.nextT += EIGHTH;
      bgm.step = (bgm.step + 1) % BGM_MELODY.length;
    }
  }
  function bgmStart() {
    if (!bgm.on || bgm.playing) return;
    const c = audio(); if (!c) return;
    if (!bgm.gain) { bgm.gain = c.createGain(); bgm.gain.gain.value = BGM_VOL; bgm.gain.connect(master); }
    bgm.playing = true;
    bgm.step = 0;
    bgm.nextT = c.currentTime + 0.1;
    bgmTick();
    bgm.timer = setInterval(bgmTick, 50);
  }
  function bgmStop() {
    clearInterval(bgm.timer);
    bgm.playing = false;
  }
  // 말하는 동안에는 배경음악을 작게
  function bgmDuck(down) {
    if (!bgm.gain || !ac) return;
    bgm.gain.gain.setTargetAtTime(down ? BGM_DUCK : BGM_VOL, ac.currentTime, 0.08);
  }

  /* =========================================================
   * 3. 화면 요소
   * ========================================================= */
  const $ = s => document.querySelector(s);
  const screens = { start: $('#screen-start'), quiz: $('#screen-quiz'), done: $('#screen-done') };
  const elProgress = $('#progress'), elPrompt = $('#prompt'), elStage = $('#stage');
  const elAnimal = $('#animal'), elBurst = $('#burst'), elTap = $('#tap-zone');
  const COLORS = ['#FF6F9C', '#FFC845', '#69B8FF', '#5CCBAE', '#A58BFF', '#FF9E7A'];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function show(name) {
    Object.entries(screens).forEach(([k, el]) => { el.hidden = k !== name; });
  }

  // 타이머 묶음 (다시 하기 때 한꺼번에 정리)
  const timers = new Set();
  function later(fn, ms) {
    const id = setTimeout(() => { timers.delete(id); fn(); }, ms);
    timers.add(id);
  }
  function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }

  // 시작 화면 그림: 그림자 → 컬러
  $('#start-art').innerHTML =
    svgOf(ANIMALS[0], 'shadow-ico') + '<span class="arrow">→</span>' + svgOf(ANIMALS[0], 'color-ico');

  // 종류 고르기 카드: 글을 몰라도 그림만 보고 고를 수 있게
  $('#cats').innerHTML = Object.entries(CATS).map(([key, c]) =>
    `<button class="btn cat" type="button" data-cat="${key}" style="--card:${c.card};--edge:${c.edge}">` +
    (c.iconSvg || svgOf(c.items[c.icon])) + `<span>${c.label}</span></button>`
  ).join('');

  // 완료 화면 글자
  $('#cheer').innerHTML = [...'참 잘했어요!'].map((ch, i) =>
    ch === ' ' ? '<span class="gap"></span>'
               : `<span style="color:${COLORS[i % COLORS.length]};animation-delay:${i * 0.08}s">${ch}</span>`
  ).join('');

  /* =========================================================
   * 4. 게임 진행
   *    phase: start → question → reveal → leaving → (question…) → done
   * ========================================================= */
  const REVEAL_MS = 3000;   // 정답 공개 후 다음 문제까지
  const TAP_LOCK_MS = 700;  // 문제 등장 직후 연타로 바로 넘어가는 것 방지
  let cat = CATS.animal, order = [], idx = 0, phase = 'start';

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function startGame(key) {
    if (key && CATS[key]) cat = CATS[key];
    // iOS 등: 사용자 터치 안에서 소리·음성을 한 번 깨워 둔다
    audio();
    if (synth) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); }
    sfxPop();
    clearTimers();
    fwStop();
    bgmStart();
    elStage.classList.toggle('sea', !!cat.sea);
    order = shuffle(cat.items);
    idx = 0;
    elProgress.innerHTML = order.map(() => '<span>★</span>').join('');
    elProgress.classList.toggle('many', order.length > 5);
    show('quiz');
    showQuestion();
  }

  function showQuestion() {
    phase = 'enter';
    const a = order[idx];
    elStage.classList.remove('revealed');
    elStage.style.setProperty('--tint', a.tint);
    elAnimal.className = 'animal-wrap';
    elAnimal.innerHTML = svgOf(a);
    void elAnimal.offsetWidth; // 애니메이션 다시 시작
    elAnimal.className = 'animal-wrap question';
    elBurst.innerHTML = '';
    elPrompt.className = 'prompt';
    elPrompt.textContent = cat.question;
    elTap.classList.remove('away');
    later(() => say(cat.question), 250);
    later(() => { phase = 'question'; }, TAP_LOCK_MS);
  }

  function reveal() {
    if (phase !== 'question') return;
    phase = 'reveal';
    const a = order[idx];
    // 효과음 없이 아기 목소리로 정답만 (터치 순간 바로 말해야 휴대폰에서 막히지 않는다)
    say(a.say || (a.sound ? `${a.name}! ${a.sound}` : `${a.name}!`), VOICE_BABY);
    elAnimal.className = 'animal-wrap revealed';
    elStage.classList.add('revealed');
    elTap.classList.add('away');
    elPrompt.className = 'prompt name' + (a.name.length >= 6 ? ' long' : '');
    elPrompt.style.setProperty('--accent', a.accent);
    elPrompt.innerHTML = (a.show || `${a.name}!`) + (a.sound ? `<small>${a.sound}</small>` : '');
    elProgress.children[idx]?.classList.add('on');
    burst();
    later(burst, 1300);
    later(() => afterSpeech(leave), REVEAL_MS);
  }

  function leave() {
    phase = 'leaving';
    elAnimal.className = 'animal-wrap leaving';
    elStage.classList.remove('revealed');
    later(() => {
      idx++;
      if (idx < order.length) showQuestion();
      else finish();
    }, 450);
  }

  function finish() {
    phase = 'done';
    $('#parade').innerHTML = order.map((a, i) =>
      svgOf(a).replace('<svg ', `<svg style="animation-delay:${i * 0.12}s" `)).join('');
    $('#parade').classList.toggle('many', order.length > 5);
    show('done');
    bgmStop();
    fwStart();
    sfxFinale();
    later(() => say('참 잘했어요!', VOICE_BABY), 900);
  }

  // 별·하트가 사방으로 튀는 효과
  function burst() {
    const n = 16;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      const ang = (i / n) * Math.PI * 2 + rand(-.2, .2);
      const dist = rand(30, 46);
      s.textContent = pick(['★', '★', '♥', '●', '★']);
      s.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'vmin');
      s.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'vmin');
      s.style.setProperty('--rot', rand(-200, 200).toFixed(0) + 'deg');
      s.style.color = pick(COLORS);
      s.style.fontSize = rand(18, 40).toFixed(0) + 'px';
      s.style.animationDelay = rand(0, .08).toFixed(2) + 's';
      frag.appendChild(s);
    }
    elBurst.appendChild(frag);
    later(() => { while (elBurst.childElementCount > 32) elBurst.firstChild.remove(); }, 1200);
  }

  /* =========================================================
   * 5. 폭죽 (canvas)
   * ========================================================= */
  const fw = { c: $('#fireworks'), x: null, parts: [], raf: 0, next: 0, until: 0, w: 0, h: 0 };
  fw.x = fw.c.getContext('2d');
  function fwResize() {
    const r = fw.c.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
    fw.w = r.width; fw.h = r.height;
    fw.c.width = Math.round(r.width * d); fw.c.height = Math.round(r.height * d);
    fw.x.setTransform(d, 0, 0, d, 0, 0);
  }
  function fwBurst(x, y) {
    const n = 34, color = pick(COLORS), k = Math.min(fw.w, fw.h) / 400;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rand(-.1, .1), sp = rand(2.2, 5.5) * k;
      fw.parts.push({ x, y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: rand(.012, .022), size: rand(2.5, 4.5), color: Math.random() < .2 ? '#FFFFFF' : color });
    }
  }
  function fwLoop(t) {
    const x = fw.x;
    x.clearRect(0, 0, fw.w, fw.h);
    if (t > fw.next) {
      fwBurst(rand(.15, .85) * fw.w, rand(.1, .5) * fw.h);
      tone(rand(900, 1400), 0, 0.12, 'sine', 0.03);
      fw.next = t + (t < fw.until ? rand(350, 650) : rand(1100, 1700));
    }
    x.lineCap = 'round';
    fw.parts = fw.parts.filter(p => p.life > 0);
    for (const p of fw.parts) {
      p.px = p.x; p.py = p.y;
      p.vx *= .985; p.vy = p.vy * .985 + .06;
      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;
      x.globalAlpha = Math.max(p.life, 0);
      x.strokeStyle = p.color;
      x.lineWidth = p.size;
      x.beginPath(); x.moveTo(p.px, p.py); x.lineTo(p.x, p.y); x.stroke();
    }
    x.globalAlpha = 1;
    fw.raf = requestAnimationFrame(fwLoop);
  }
  function fwStart() {
    fwResize();
    fw.parts = [];
    const now = performance.now();
    fw.next = now; fw.until = now + 5000;
    cancelAnimationFrame(fw.raf);
    fw.raf = requestAnimationFrame(fwLoop);
  }
  function fwStop() { cancelAnimationFrame(fw.raf); fw.raf = 0; fw.parts = []; }
  window.addEventListener('resize', () => { if (fw.raf) fwResize(); });

  /* =========================================================
   * 6. 입력
   * ========================================================= */
  $('#cats').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]');
    if (b) startGame(b.dataset.cat);
  });
  $('#btn-again').addEventListener('click', () => startGame());
  function goHome() {
    clearTimers(); fwStop(); if (synth) synth.cancel();
    phase = 'start';
    show('start');
    bgmStart();
  }
  $('#btn-home').addEventListener('click', goHome);
  // 문제 화면은 아무 데나 누르면 정답 공개이므로, 집 버튼 터치는 거기로 새지 않게 막는다
  $('#btn-back').addEventListener('pointerup', e => e.stopPropagation());
  $('#btn-back').addEventListener('click', e => { e.stopPropagation(); goHome(); });
  // 문제 화면은 아무 데나 터치해도 정답 공개
  screens.quiz.addEventListener('pointerup', reveal);
  $('#btn-reveal').addEventListener('click', reveal); // 키보드(Enter/Space)용
  document.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && !screens.quiz.hidden && e.target === document.body) { e.preventDefault(); reveal(); }
  });
  // 아이가 길게 누르거나 두 손가락으로 확대하는 것 막기
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  // 배경음악 켜기/끄기 (모든 화면 왼쪽 위)
  const elMusic = $('#btn-music');
  function paintMusic() {
    elMusic.setAttribute('aria-pressed', String(bgm.on));
    elMusic.classList.toggle('off', !bgm.on);
  }
  elMusic.addEventListener('click', () => {
    bgm.on = !bgm.on;
    try { localStorage.setItem('shadow-bgm', bgm.on ? 'on' : 'off'); } catch (e) { /* 무시 */ }
    if (bgm.on && phase !== 'done') bgmStart(); else bgmStop();
    paintMusic();
  });
  paintMusic();

  // 앱을 내리면 소리를 멈추고, 돌아오면 배경음악만 다시
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (synth) synth.cancel(); bgmStop(); }
    else if (ac && phase !== 'done') bgmStart();
  });

  // 이 기기에 한국어 음성이 없으면 첫 화면에 보호자용 안내
  setTimeout(() => {
    if (!synth || (voicesSeen && !koVoice)) showVoiceNote('none');
  }, 1500);
})();
</script>
</body>
</html>
